[graph]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
deny = []

[advisories]
ignore = [
    "RUSTSEC-2024-0437", # inherited advisory; remove after patched transitive release is available.
    "RUSTSEC-2026-0190", # anyhow downcast_mut advisory; remove after patched release is available.
    "RUSTSEC-2026-0204", # inherited crossbeam-epoch pointer advisory; remove after patched release is available.
]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
