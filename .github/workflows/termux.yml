name: termux

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: termux-${{ github.workflow }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  runner-config:
    name: runner-config
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.validate.outputs.labels }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Validate runner labels variable and source SHA
        id: validate
        shell: sh
        env:
          LABELS_RAW: ${{ vars.TERMUX_RUNNER_LABELS }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -z "$LABELS_RAW" ]; then
            echo "::error::vars.TERMUX_RUNNER_LABELS empty"
            exit 1
          fi
          echo "$LABELS_RAW" | jq -e '
            type == "array"
            and length == 2
            and all(.[]; type == "string" and length > 0)
            and contains(["self-hosted"])
            and contains(["termux"])
          ' > /dev/null || {
            echo "::error::vars.TERMUX_RUNNER_LABELS invalid"
            exit 1
          }
          case "$INPUT_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
              ;;
            *)
              echo "::error::source_sha must be 40 lowercase hex chars"
              exit 1
              ;;
          esac
          echo "labels=$LABELS_RAW" >> "$GITHUB_OUTPUT"
          echo "source_sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"

  termux:
    name: authoritative-termux
    needs: runner-config
    environment: termux-attestation
    runs-on: ${{ fromJSON(needs.runner-config.outputs.labels) }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11760c93482637271783149392128615266045d9 # v4.2.2
        with:
          ref: ${{ needs.runner-config.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Exact SHA diagnostic check
        shell: sh
        run: |
          echo "Expected SHA: ${{ needs.runner-config.outputs.source_sha }}"
          echo "Actual SHA:   $(git rev-parse HEAD)"

      - name: Verify exact checkout
        shell: sh
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ needs.runner-config.outputs.source_sha }}"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run Termux verification
        shell: sh
        run: sh ./scripts/verify-termux

      - name: Clean runner workspace
        if: always()
        shell: sh
        run: |
          find "${TMPDIR:?}" -mindepth 1 -maxdepth 1 \
            -name 'pi-rs-verify.*' -exec rm -rf -- {} +
