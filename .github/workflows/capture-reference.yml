name: capture-reference

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone to capture (e.g. M1a)"
        required: true
        default: "M1a"
      case:
        description: "Optional exact case selector"
        required: false
        default: ""

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Clone upstream Pi
        run: |
          git clone https://github.com/earendil-works/pi-mono.git upstream-pi-mono
          cd upstream-pi-mono
          git checkout 2efa728d2ee90ef597626e96b1e28ef2b279f07c

      - name: Verify lockfile SHA-256
        run: |
          # Upstream lockfile SHA-256 must match exactly:
          # 472f0726dc79f3b38df58d8a8bce96bf56fbf993a134b49aabc54947b8461e59
          test "$(sha256sum upstream-pi-mono/package-lock.json | awk '{print $1}')" = "472f0726dc79f3b38df58d8a8bce96bf56fbf993a134b49aabc54947b8461e59"

      - name: Install upstream Pi dependencies
        run: |
          cd upstream-pi-mono
          npm cache clean --force
          npm ci
          mkdir -p /tmp/gaxios-repair
          npm pack gaxios@7.1.4 --pack-destination /tmp/gaxios-repair
          tar -xzf /tmp/gaxios-repair/gaxios-7.1.4.tgz -C /tmp/gaxios-repair
          cp /tmp/gaxios-repair/package/package.json node_modules/gaxios/package.json
          node -e "JSON.parse(require('fs').readFileSync('node_modules/gaxios/package.json', 'utf8')); console.log('validated node_modules/gaxios/package.json')"
          node --import tsx/esm packages/ai/scripts/generate-models.ts \
            --strict --data-only
          npm run build
          rm -rf node_modules/gaxios
          cp -R /tmp/gaxios-repair/package node_modules/gaxios
          node --input-type=module -e '
            import fs from "node:fs";
            const raw = fs.readFileSync(
              "node_modules/gaxios/package.json", "utf8");
            JSON.parse(raw);
          '
          node --import tsx/esm --input-type=module -e '
            import fs from "node:fs";
            const raw = fs.readFileSync(
              "node_modules/gaxios/package.json", "utf8");
            JSON.parse(raw);
          '
          sha256sum node_modules/gaxios/package.json

      - name: Install and attest search tools
        if: ${{ github.event.inputs.case == 'tool.grep-find-ls' || github.event.inputs.milestone == 'M1' || github.event.inputs.milestone == 'M1a' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep fd-find
          for tool in rg fdfind; do
            command -v "$tool"
            realpath "$(command -v "$tool")"
            "$tool" --version | head -n 1
            sha256sum "$(realpath "$(command -v "$tool")")" | awk '{print $1}' | grep -Eq '^[0-9a-f]{64}$'
          done

      - name: Run reference capture
        env:
          PI_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-pi-mono
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PI_MODEL: gemini-3-flash-preview
          CAPTURE_MILESTONE: ${{ github.event.inputs.milestone }}
          CAPTURE_CASE: ${{ github.event.inputs.case }}
        run: |
          args=(--milestone "$CAPTURE_MILESTONE")
          if [ -n "$CAPTURE_CASE" ]; then args+=(--case "$CAPTURE_CASE"); fi
          python3 scripts/capture-upstream-fixtures "${args[@]}"
          if [ -n "$CAPTURE_CASE" ]; then
            python3 scripts/validate-fixture-manifest
            python3 - "$CAPTURE_CASE" <<'PY'
          import json
          import sys
          case = sys.argv[1]
          with open("fixtures/upstream-pi/manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["cases"][case]["captured"] is True
          assert manifest["captureEnvironment"]["captureScope"]["caseIds"] == [case]
          PY
          else
            python3 scripts/validate-fixture-manifest --milestone "$CAPTURE_MILESTONE"
          fi

      - name: Repeat selected capture and compare
        if: ${{ github.event.inputs.case != '' }}
        env:
          PI_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-pi-mono
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PI_MODEL: gemini-3-flash-preview
          CAPTURE_MILESTONE: ${{ github.event.inputs.milestone }}
          CAPTURE_CASE: ${{ github.event.inputs.case }}
        run: |
          cp "fixtures/upstream-pi/${CAPTURE_CASE}.expected.json" /tmp/expected.json
          cp "fixtures/upstream-pi/${CAPTURE_CASE}.raw-hash.txt" /tmp/raw-hash.txt
          python3 scripts/capture-upstream-fixtures --milestone "$CAPTURE_MILESTONE" --case "$CAPTURE_CASE"
          cmp /tmp/expected.json "fixtures/upstream-pi/${CAPTURE_CASE}.expected.json"
          cmp /tmp/raw-hash.txt "fixtures/upstream-pi/${CAPTURE_CASE}.raw-hash.txt"

      - name: Archive captured fixtures
        uses: actions/upload-artifact@v4
        with:
          name: captured-fixtures-${{ github.event.inputs.milestone }}
          path: fixtures/upstream-pi/
