name: capture-reference

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone to capture (e.g. M1a)"
        required: true
        default: "M1a"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"

      - name: Clone upstream Pi
        run: |
          git clone https://github.com/earendil-works/pi-mono.git \
            upstream-pi-mono
          cd upstream-pi-mono
          git checkout 2efa728d2ee90ef597626e96b1e28ef2b279f07c

      - name: Verify lockfile SHA-256
        run: |
          # Upstream lockfile SHA-256 must match exactly
          EXP="472f0726dc79f3b38df58d8a8bce96bf56fbf993a134b49aabc54947b8461e59"
          ACT=$(sha256sum upstream-pi-mono/package-lock.json | cut -d' ' -f1)
          test "$ACT" = "$EXP"

      - name: Install upstream Pi dependencies
        run: |
          cd upstream-pi-mono
          npm ci
          npm run hydrate-model-data --workspace=@earendil-works/pi-ai
          npm run build:offline --workspace=@earendil-works/pi-ai

      - name: Verify generated model data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "upstream-pi-mono/packages/ai/src/providers/data/amazon-bedrock.json"
          )
          raw = path.read_bytes()
          print(f"amazon-bedrock.json bytes={len(raw)} prefix={raw[:80]!r}")
          json.loads(raw)
          print("amazon-bedrock.json is valid JSON")
          PY

      - name: Run reference capture
        env:
          PI_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-pi-mono
        run: |
          python3 scripts/capture-upstream-fixtures \
            --milestone "${{ github.event.inputs.milestone }}"

      - name: Validate captured fixture manifest
        run: |
          python3 scripts/validate-fixture-manifest \
            --milestone "${{ github.event.inputs.milestone }}"

      - name: Archive captured fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: captured-fixtures-${{ github.event.inputs.milestone }}
          path: fixtures/upstream-pi/
