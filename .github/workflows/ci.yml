name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.80"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo build workspace debug
        run: cargo build --workspace --all-targets

      - name: cargo build workspace release
        run: cargo build --workspace --release

      - name: cargo test
        run: cargo test --workspace

      - name: cargo fmt --check
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Python contract tests
        run: |
          python3 -m unittest discover -s tests/contract -p "test_*.py"

      - name: Validate fixture manifest (M0 validation - permits pending capture)
        run: |
          python3 scripts/validate-fixture-manifest

      - name: Run comparator self-tests
        run: |
          python3 scripts/compare-contract-fixtures --self-test

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny, cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
