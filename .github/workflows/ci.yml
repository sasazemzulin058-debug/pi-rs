name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.80"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo build workspace debug
        run: cargo build --workspace --all-targets

      - name: cargo build workspace release
        run: cargo build --workspace --release

      - name: Upload release artifact
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: pi-rs-ubuntu-latest-stable
          path: target/release/pi-rs

      - name: cargo test
        run: cargo test --workspace

      - name: cargo fmt --check
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Python contract tests
        run: |
          python3 -m unittest discover -s tests/contract -p "test_*.py"

      - name: Validate fixture manifest (M0 validation)
        run: |
          python3 scripts/validate-fixture-manifest

      - name: Run comparator self-tests
        run: |
          python3 scripts/compare-contract-fixtures --self-test

      - name: Run CLI and Termux prerequisite smoke
        run: |
          bash scripts/termux-smoke.sh --binary target/release/pi-rs

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny, cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: >-
          cargo audit --ignore RUSTSEC-2026-0204 --ignore RUSTSEC-2026-0185
          --ignore RUSTSEC-2026-0190

  build-android:
    name: build (android-aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;25.2.9519653"
      - name: cargo build release for aarch64-linux-android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          export LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export LLVM="$LLVM/bin"
          linker="$LLVM/aarch64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$LLVM/llvm-ar"
          cargo build --package pi-coding-agent --release \
            --target aarch64-linux-android
      - name: Upload Termux aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-rs-aarch64-linux-android
          path: target/aarch64-linux-android/release/pi-rs
