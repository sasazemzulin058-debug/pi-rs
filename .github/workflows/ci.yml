name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.80"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo build workspace debug
        run: cargo build --locked --workspace --all-targets

      - name: cargo build workspace release
        run: cargo build --locked --workspace --release

      - name: cargo test
        run: cargo test --locked --workspace --all-targets

      - name: cargo fmt --check
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo doc
        if: matrix.rust == 'stable'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

      - name: Run Python contract tests
        run: |
          python3 -m unittest discover -s tests/contract -p "test_*.py"

      - name: Validate fixture manifest (M0 validation)
        run: |
          python3 scripts/validate-fixture-manifest

      - name: Run comparator self-tests
        run: |
          python3 scripts/compare-contract-fixtures --self-test

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-deny, cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: >-
          cargo audit --ignore RUSTSEC-2026-0204 --ignore RUSTSEC-2026-0185
          --ignore RUSTSEC-2026-0190

  m1a-manifest-gate:
    name: m1a-manifest-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run Python contract tests
        run: |
          python3 -m unittest discover -s tests/contract -p "test_*.py"
      - name: Validate fixture manifest structure
        run: |
          python3 scripts/validate-fixture-manifest
      - name: Run comparator self-tests
        run: |
          python3 scripts/compare-contract-fixtures --self-test
      - name: Run invariant fixture gate
        run: |
          actual_dir=$(mktemp -d)
          trap 'rm -rf "$actual_dir"' EXIT
          ./scripts/generate-pi-rs-fixtures --milestone M1a --actual "$actual_dir" --invariant-only
          ./scripts/compare-contract-fixtures --milestone M1a --actual "$actual_dir" --invariant-only --exclude-case termux.env

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check doc consistency
        run: python3 scripts/check-doc-consistency
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: latest
      - name: Build book
        run: mdbook build docs

  ci-required:
    name: ci-required
    needs: [test, supply-chain, m1a-manifest-gate, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required status
        run: echo "All required CI jobs completed successfully."
