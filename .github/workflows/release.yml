name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: required CI for release SHA
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate:
    name: validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11760c93482637271783149392128615266045d9
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked out triggering SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run version validation script
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF" = "$TAG" ]; then
            ./scripts/check-release-version
          else
            ./scripts/check-release-version "$TAG"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: [validate, ci]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-latest, target: aarch64-unknown-linux-gnu}
    steps:
      - uses: actions/checkout@11760c93482637271783149392128615266045d9
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked out triggering SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@c59d99787e9cf2efbcfedfa45100067b5e40e69d
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0deed1e0edfc266b0575d7e3e42550db4bb6882
      - name: install cross-compilers (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="\
          "aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: build release
        run: |
          cargo build --locked --release \
            --target ${{ matrix.target }} -p pi-coding-agent
      - name: package
        run: ./scripts/package-release ${{ matrix.target }} dist
      - name: Smoke test native archive
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        run: |
          tar -xzf dist/pi-rs-${{ matrix.target }}.tar.gz
          ./pi-rs-${{ matrix.target }}/pi-rs --version
          ./pi-rs-${{ matrix.target }}/pi-rs --help
      - name: Smoke test Linux ARM archive with QEMU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          tar -xzf dist/pi-rs-${{ matrix.target }}.tar.gz
          qemu-aarch64 -L /usr/aarch64-linux-gnu ./pi-rs-${{ matrix.target }}/pi-rs --version
          qemu-aarch64 -L /usr/aarch64-linux-gnu ./pi-rs-${{ matrix.target }}/pi-rs --help
      - uses: actions/upload-artifact@4bec3a0f5a706173474b119cb4e068fc2cd1d6bf
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11760c93482637271783149392128615266045d9
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          path: dist
          merge-multiple: true
      - name: Verify checked out triggering SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Generate release manifest and SHA256SUMS
        run: |
          cd dist
          python3 - "$GITHUB_REF_NAME" << 'EOF'
          import hashlib, json, os, sys
          tag = sys.argv[1]
          names = sorted(name for name in os.listdir('.') if name.startswith(('pi-rs-', 'release-sbom-')) and name.endswith(('.tar.gz', '.spdx.json')))
          sums = {}
          for fname in names:
              data = open(fname, 'rb').read()
              sums[fname] = {'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          with open('release-manifest.json', 'w', encoding='utf-8') as f:
              json.dump({'version': tag, 'artifacts': sums}, f, indent=2, sort_keys=True)
              f.write('\n')
          EOF
          sha256sum pi-rs-*.tar.gz release-sbom-*.spdx.json \
            release-manifest.json > SHA256SUMS
      - name: Verify release artifacts checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release-artifacts dist
      - name: Generate provenance attestation
        # v2
        uses: >-
          actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/release-manifest.json
            dist/SHA256SUMS
      # v2.2.1
      - uses: >-
          softprops/action-gh-release@c95fe0f22b73ab19187909d02d5a9d20c57173e6
        with:
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/release-manifest.json
            dist/SHA256SUMS
          generate_release_notes: true
